<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de las islas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AVENTURA MATEMÁTICA</p>
        <h1>Mapa de las islas</h1>
      </div>
      <button id="reset-progress" class="reset-button" type="button" title="Volver al progreso inicial">Reiniciar progreso</button>
    </header>

    <section class="map-panel" aria-label="Mapa de las ocho islas">
      <div id="map-container" class="map-container">
        <img class="map-base" src="assets/mapa_8_islas.png" alt="Mapa con ocho islas">
        <div id="mask-layer" class="mask-layer" aria-hidden="true"></div>
        <svg id="island-hitareas" class="island-hitareas" viewBox="0 0 1122 676"
             preserveAspectRatio="none" role="group" aria-label="Seleccionar una isla"></svg>
      </div>
    </section>
    <p class="map-hint">Selecciona una isla para continuar.</p>
  </main>

  <div id="modal-backdrop" class="modal-backdrop hidden" role="presentation">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <button id="modal-close" class="modal-close" type="button" aria-label="Cerrar">×</button>
      <p id="modal-kicker" class="modal-kicker">AVENTURA</p>
      <h2 id="modal-title">Título</h2>
      <p id="modal-message" class="modal-message"></p>
      <div id="modal-actions" class="modal-actions"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
